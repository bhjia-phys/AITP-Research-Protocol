[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitp-research-protocol"
version = "0.3.0"
description = "Local-first research protocol for theoretical physics"
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
aitp = "aitp.cli:main"

[tool.setuptools]
package-dir = {"" = "plugins/aitp-research-protocol/scripts/vendor"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["plugins/aitp-research-protocol/scripts/vendor"]

[tool.setuptools.package-data]
aitp = ["resources/templates/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["plugins/aitp-research-protocol/scripts/vendor"]
